<aside style="
  width: 280px;
  background: linear-gradient(180deg, #0f172a 0%, #1a1f3a 100%);
  border-right: 1px solid #00d9ff20;
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: fixed;
  left: 0;
  top: 0;
  padding-top: 80px;
  box-shadow: 2px 0 16px rgba(0, 217, 255, 0.1);
  z-index: 100;
">
  <!-- Logo/Project Name -->
  <div style="
    padding: 24px 20px;
    border-bottom: 1px solid #00d9ff20;
    margin-bottom: 24px;
  ">
    <h2 style="
      margin: 0;
      color: #00d9ff;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0, 217, 255, 0.3);
    ">
      ERP ALEEK
    </h2>
  </div>

  <!-- Menu Items -->
  <nav style="flex: 1; padding: 0 12px;">
    <a 
      *ngFor="let item of menuItems"
      [routerLink]="item.routerLink"
      routerLinkActive="active"
      style="
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 16px;
        color: #cbd5e1;
        text-decoration: none;
        border-radius: 8px;
        margin-bottom: 8px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border-left: 3px solid transparent;
        cursor: pointer;
      "
      onmouseenter="this.style.backgroundColor='rgba(0, 217, 255, 0.1)'; this.style.color='#00d9ff'; this.style.borderLeftColor='#00d9ff';"
      onmouseleave="if (!this.classList.contains('active')) { this.style.backgroundColor='transparent'; this.style.color='#cbd5e1'; this.style.borderLeftColor='transparent'; }"
    >
      <i [class]="'pi ' + item.icon" style="font-size: 18px;"></i>
      <span style="font-weight: 500; font-size: 14px;">{{ item.label }}</span>
    </a>
  </nav>

  <!-- Version -->
  <div style="
    padding: 20px;
    border-top: 1px solid #00d9ff20;
    text-align: center;
  ">
    <p style="
      margin: 0;
      color: #64748b;
      font-size: 12px;
      letter-spacing: 0.5px;
    ">
      v{{ appVersion }}
    </p>
  </div>
</aside>
