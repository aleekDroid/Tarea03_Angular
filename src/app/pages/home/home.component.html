<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px;">
  <p-card [ngStyle]="{'margin-bottom': '16px'}">
    <ng-template pTemplate="header">
      <div style="background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); height: 160px; display: flex; align-items: center; justify-content: center;">
        <i class="pi pi-home" style="color: white; font-size: 48px;"></i>
      </div>
    </ng-template>
    <ng-template pTemplate="title">
      Bienvenido al Home
    </ng-template>
    <p style="color: #4b5563;">
      Esta es tu pantalla principal. Aquí irá el contenido que desees mostrar.
    </p>
  </p-card>

  <p-card [ngStyle]="{'margin-bottom': '16px'}">
    <ng-template pTemplate="header">
      <div style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); height: 160px; display: flex; align-items: center; justify-content: center;">
        <i class="pi pi-inbox" style="color: white; font-size: 48px;"></i>
      </div>
    </ng-template>
    <ng-template pTemplate="title">
      Panel de Control
    </ng-template>
    <p style="color: #4b5563;">
      Accede a tus funcionalidades principales desde aquí.
    </p>
  </p-card>

  <p-card [ngStyle]="{'margin-bottom': '16px'}">
    <ng-template pTemplate="header">
      <div style="background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%); height: 160px; display: flex; align-items: center; justify-content: center;">
        <i class="pi pi-cog" style="color: white; font-size: 48px;"></i>
      </div>
    </ng-template>
    <ng-template pTemplate="title">
      Configuración
    </ng-template>
    <p style="color: #4b5563;">
      Personaliza tu experiencia según tus necesidades.
    </p>
  </p-card>
</div>
