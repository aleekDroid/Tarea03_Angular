<p-toast></p-toast>

<div class="card">

  <div class="header">
    <h2>Gestión de Grupos</h2>

    <button pButton label="Nuevo Grupo" icon="pi pi-plus" (click)="openNew()">
    </button>
  </div>

  <p-table [value]="groups" dataKey="id" [paginator]="true" [rows]="10" [showGridlines]="true"
    responsiveLayout="scroll">

    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Categoría</th>
        <th>Nivel</th>
        <th>Autor</th>
        <th>Miembros</th>
        <th>Tickets</th>
        <th>Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-group>

      <tr>

        <td>{{group.id}}</td>

        <td>{{group.nombre}}</td>

        <td>
          <p-tag [value]="group.categoria" severity="info"></p-tag>
        </td>

        <td>
          <p-tag [value]="group.nivel" severity="success"></p-tag>
        </td>

        <td>{{group.autor}}</td>

        <td>{{group.miembros}}</td>

        <td>{{group.tickets}}</td>

        <td class="actions">

          <button pButton icon="pi pi-ellipsis-v" (click)="op.toggle($event)">
          </button>

          <p-overlayPanel #op>
            <ng-template pTemplate="content">
              <div class="menu-items">
                <button pButton label="Ver Tickets" icon="pi pi-ticket" (click)="openGroupTickets(group); op.hide()"></button>
                <button pButton label="Gestionar Usuarios" icon="pi pi-users" (click)="manageGroup(group); op.hide()"></button>
              </div>
            </ng-template>
          </p-overlayPanel>

        </td>

      </tr>

    </ng-template>

  </p-table>

</div>

<p-dialog header="Grupo" [(visible)]="groupDialog" [modal]="true" [style]="{width:'400px'}">

  <div class="form">

    <input pInputText [(ngModel)]="selectedGroup.nombre" placeholder="Nombre">

    <input pInputText [(ngModel)]="selectedGroup.categoria" placeholder="Categoría">

    <input pInputText [(ngModel)]="selectedGroup.nivel" placeholder="Nivel">

    <input pInputText [(ngModel)]="selectedGroup.autor" placeholder="Autor">

    <input pInputText type="number" [(ngModel)]="selectedGroup.miembros" placeholder="Miembros">

    <input pInputText type="number" [(ngModel)]="selectedGroup.tickets" placeholder="Tickets">

    <button pButton label="Guardar" icon="pi pi-check" (click)="saveGroup()">
    </button>

  </div>

</p-dialog>
