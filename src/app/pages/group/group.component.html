<!-- src/app/pages/group/group.component.html -->
<p-toast></p-toast>

<div class="card">

  <div class="header">
    <h2>Gestión de Grupos</h2>

    <button *appHasPermission="'create_group'" pButton label="Nuevo Grupo" icon="pi pi-plus" (click)="openNew()">
    </button>
  </div>

  <p-table [value]="groups" dataKey="id" [paginator]="true" [rows]="10" [showGridlines]="true"
    responsiveLayout="scroll">

    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Categoría</th>
        <th>Nivel</th>
        <th>Autor</th>
        <th>Miembros</th>
        <th>Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-group>

      <tr>

        <td>{{group.nombre}}</td>

        <td>
          <p-tag [value]="group.categoria" severity="info"></p-tag>
        </td>

        <td>
          <p-tag [value]="group.nivel" severity="success"></p-tag>
        </td>

        <td>{{group.creador_nombre}}</td>

        <td>{{group.miembros}}</td>


        <td class="actions">

          <button pButton icon="pi pi-ellipsis-v" (click)="op.toggle($event)">
          </button>

          <p-overlayPanel #op>
            <ng-template pTemplate="content">
              <div class="menu-items">
                <button pButton label="Ver Tickets" icon="pi pi-ticket" (click)="openGroupTickets(group); op.hide()"></button>
                <button *appHasPermission="'create_group'" pButton label="Editar" icon="pi pi-pencil" (click)="editGroup(group); op.hide()"></button>
                <button *appHasPermission="'manage_users'" pButton label="Ver Usuarios" icon="pi pi-users" (click)="manageGroup(group); op.hide()"></button>
              </div>
            </ng-template>
          </p-overlayPanel>

        </td>

      </tr>

    </ng-template>

  </p-table>

</div>

<p-dialog header="Grupo" [(visible)]="groupDialog" [modal]="true" [style]="{width:'400px'}">

  <div class="form">

    <label for="nombre">Nombre</label>
    <input pInputText [(ngModel)]="selectedGroup.nombre" placeholder="Ingresa el nombre del grupo">

    <label for="categoria">Categoría</label>
    <input pInputText [(ngModel)]="selectedGroup.categoria" placeholder="Categoría del grupo">

    <label for="nivel">Nivel</label>
    <input pInputText [(ngModel)]="selectedGroup.nivel" placeholder="Nivel del grupo">

    <label for="creador_nombre">Autor</label>
    <input pInputText [(ngModel)]="selectedGroup.creador_nombre" placeholder="Autor del grupo">

    <label for="miembros">Miembros</label>
    <input pInputText type="number" [(ngModel)]="selectedGroup.miembros" placeholder="Miembros del grupo">

    <button pButton label="Guardar" icon="pi pi-check" (click)="saveGroup()">
    </button>

  </div>

</p-dialog>
