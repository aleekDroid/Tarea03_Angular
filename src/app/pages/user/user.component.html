<p-toast></p-toast>

<div class="profile-container">

  <p-card header="Perfil de Usuario">

    <div class="grid">

      <div class="field">
        <label>Nombres</label>
        <input pInputText [(ngModel)]="user.name">
      </div>

      <div class="field">
        <label>Apellidos</label>
        <input pInputText [(ngModel)]="user.lastName">
      </div>

      <div class="field full">
        <label>Email</label>
        <input pInputText [(ngModel)]="user.email" disabled>
      </div>

      <div class="field">
        <label>Teléfono</label>
        <input pInputText [(ngModel)]="user.phone">
      </div>

      <div class="field">
        <label>Edad</label>
        <p-inputNumber [(ngModel)]="user.age"></p-inputNumber>
      </div>

      <div class="field full">
        <label>Dirección</label>
        <input pInputText [(ngModel)]="user.address">
      </div>

      <div class="field full">
        <label>Cambiar contraseña</label>
        <p-password
          [(ngModel)]="user.password"
          toggleMask="true"
          [feedback]="false">
        </p-password>
      </div>

    </div>

    <div class="actions">

      <button
        pButton
        label="Guardar cambios"
        icon="pi pi-save"
        (click)="saveProfile()">
      </button>

    </div>

  </p-card>

</div>

<div class="assigned-tickets-container" *ngIf="assignedTickets.length > 0">
  <h2>Tickets asignados</h2>
  <p-table [value]="assignedTickets" [paginator]="true" [rows]="5" [responsiveLayout]="'scroll'">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Estado</th>
        <th>Prioridad</th>
        <th>Grupo</th>
        <th>Fecha límite</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-ticket>
      <tr>
        <td>{{ ticket.id }}</td>
        <td>{{ ticket.titulo }}</td>
        <td>{{ ticket.estado }}</td>
        <td>{{ ticket.prioridad }}</td>
        <td>{{ ticket.grupoId }}</td>
        <td>{{ ticket.fechaLimite | date:'dd-MM-yyyy' }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<div class="assigned-tickets-container" *ngIf="assignedTickets.length === 0">
  <p>No hay tickets asignados actualmente.</p>
</div>
