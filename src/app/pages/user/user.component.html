<p-toast></p-toast>

<div class="profile-container">

  <p-card header="Perfil de Usuario">

    <div class="grid">

      <div class="field">
        <label>Nombres</label>
        <input pInputText [(ngModel)]="user.name">
      </div>

      <div class="field">
        <label>Apellidos</label>
        <input pInputText [(ngModel)]="user.lastName">
      </div>

      <div class="field full">
        <label>Email</label>
        <input pInputText [(ngModel)]="user.email" disabled>
      </div>

      <div class="field">
        <label>Teléfono</label>
        <input pInputText [(ngModel)]="user.phone">
      </div>

      <div class="field">
        <label>Edad</label>
        <p-inputNumber [(ngModel)]="user.age"></p-inputNumber>
      </div>

      <div class="field full">
        <label>Dirección</label>
        <input pInputText [(ngModel)]="user.address">
      </div>

      <div class="field full">
        <label>Cambiar contraseña</label>
        <p-password
          [(ngModel)]="user.password"
          toggleMask="true"
          [feedback]="false">
        </p-password>
      </div>

    </div>

    <div class="actions">

      <button
        pButton
        label="Guardar cambios"
        icon="pi pi-save"
        (click)="saveProfile()">
      </button>

    </div>

  </p-card>

</div>
