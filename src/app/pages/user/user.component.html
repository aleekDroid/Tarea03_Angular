<p-toast></p-toast>

<div class="profile-container">

  <p-card header="Perfil de Usuario">

    <div class="grid">

      <div class="field">
        <label>Usuario</label>
        <input pInputText [(ngModel)]="user.username">
      </div>

      <div class="field">
        <label>ID</label>
        <input pInputText [(ngModel)]="user.id" disabled>
      </div>

      <div class="field full">
        <label>Permisos</label>
        <input pInputText [ngModel]="user.permisos.join(', ')" disabled>
      </div>

    </div>

    <div class="actions">

      <button
        pButton
        label="Guardar cambios"
        icon="pi pi-save"
        (click)="saveProfile()">
      </button>

    </div>

  </p-card>

</div>

<div class="assigned-tickets-container" *ngIf="assignedTickets.length > 0">
  <h2>Tickets asignados</h2>
  <p-table [value]="assignedTickets" [paginator]="true" [rows]="5" [responsiveLayout]="'scroll'">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Estado</th>
        <th>Prioridad</th>
        <th>Grupo</th>
        <th>Fecha límite</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-ticket>
      <tr>
        <td>{{ ticket.id }}</td>
        <td>{{ ticket.titulo }}</td>
        <td>{{ ticket.estado }}</td>
        <td>{{ ticket.prioridad }}</td>
        <td>{{ ticket.grupoNombre || ticket.grupoId }}</td>
        <td>{{ ticket.fechaLimite | date:'dd-MM-yyyy' }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<div class="assigned-tickets-container" *ngIf="assignedTickets.length === 0">
  <p>No hay tickets asignados actualmente.</p>
</div>
