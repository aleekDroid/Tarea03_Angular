<div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #e0f2fe 0%, #e0e7ff 100%);">
  <p-toast></p-toast>
  
  <p-card [style]="{'width': '400px'}">
    <ng-template pTemplate="header">
      <div style="text-align: center; padding: 24px;">
        <h2 style="font-size: 24px; font-weight: bold; color: #1f2937; margin: 0;">Crear Cuenta</h2>
      </div>
    </ng-template>

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <label style="display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 8px;">
          Email
        </label>
        <input
          pInputText
          [(ngModel)]="email"
          type="email"
          style="width: 100%;"
          placeholder="tu@email.com"
          [disabled]="loading"
        />
      </div>

      <div>
        <label style="display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 8px;">
          Contraseña
        </label>
        <input
          pInputText
          [(ngModel)]="password"
          type="password"
          style="width: 100%;"
          placeholder="••••••••"
          [disabled]="loading"
        />
      </div>

      <div>
        <label style="display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 8px;">
          Confirmar Contraseña
        </label>
        <input
          pInputText
          [(ngModel)]="confirmPassword"
          type="password"
          style="width: 100%;"
          placeholder="••••••••"
          [disabled]="loading"
        />
      </div>

      <p-button
        label="Registrarse"
        (click)="register()"
        [loading]="loading"
        [style]="{'width': '100%'}"
      ></p-button>

      <p style="text-align: center; font-size: 14px; color: #4b5563;">
        ¿Ya tienes cuenta?
        <a routerLink="/login" style="color: #4f46e5; text-decoration: none; font-weight: 500;">
          Inicia sesión
        </a>
      </p>
    </div>
  </p-card>
</div>
