<div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #2e3f4f 0%, #6b7280 100%);">
  <p-toast></p-toast>

  <p-card [style]="{'width': '400px', 'background': 'rgba(30, 30, 30, 0.8)', 'color': '#c6d4e7'}">
    <ng-template pTemplate="header">
      <div style="text-align: center; padding: 24px;">
        <h2 style="font-size: 24px; font-weight: bold; color: #a4b0c1; margin: 0;">Iniciar Sesión</h2>
      </div>
    </ng-template>

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <label style="display: block; font-size: 14px; font-weight: 500; color: #a4b0c1; margin-bottom: 8px;">
          Email
        </label>
        <input
          pInputText
          [(ngModel)]="email"
          type="email"
          style="width: 100%;"
          placeholder="Ingresa tu email..."
          [disabled]="loading"
        />
        <p style="font-size: 12px; color: #6b7280; margin-top: 4px;">Prueba: {{ testEmail }}</p>
      </div>

      <div>
        <label style="display: block; font-size: 14px; font-weight: 500; color: #a4b0c1; margin-bottom: 8px;">
          Contraseña
        </label>
        <input
          pInputText
          [(ngModel)]="password"
          type="password"
          style="width: 100%;"
          placeholder="••••••••"
          [disabled]="loading"
        />
        <p style="font-size: 12px; color: #6b7280; margin-top: 4px;">Prueba: password123</p>
      </div>

      <p-button
        label="Iniciar Sesión"
        (click)="login()"
        [loading]="loading"
        [style]="{'width': '100%'}"
      ></p-button>

      <p style="text-align: center; font-size: 14px; color: #a4b0c1;">
        ¿No tienes cuenta?
        <a routerLink="/register" style="color: #4f46e5; text-decoration: none; font-weight: 500;">
          Regístrate aquí
        </a>
      </p>
    </div>
  </p-card>
</div>
